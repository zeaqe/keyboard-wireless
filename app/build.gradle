plugins {
    id 'com.android.application'
}

android {
    namespace 'com.intiku.hid'
    compileSdk 34

    defaultConfig {
        applicationId "com.intiku.hid"
        minSdk 26 // Bisa diinstal di Android 8.0+, tapi fitur HID aktif di 28+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}