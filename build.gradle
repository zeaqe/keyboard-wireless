// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    // Mendeklarasikan versi Android Gradle Plugin (AGP) yang digunakan
    // "apply false" berarti plugin ini hanya didaftarkan di root, tapi baru diaktifkan di dalam folder "app"
    id 'com.android.application' version '8.1.1' apply false
    id 'com.android.library' version '8.1.1' apply false
}

// Tugas (task) opsional untuk membersihkan folder build lama saat Anda menjalankan "Build > Clean Project"
task clean(type: Delete) {
    delete rootProject.buildDir
}