# [WAJIB] Mengaktifkan dukungan AndroidX (struktur Android modern)
android.useAndroidX=true

# [WAJIB] Mengonversi library lama pihak ketiga agar kompatibel dengan AndroidX
android.enableJetifier=true

# [OPSIONAL TAPI SANGAT DISARANKAN] Mempercepat proses build di GitHub Actions
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true